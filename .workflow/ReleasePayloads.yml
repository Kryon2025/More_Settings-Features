version: '1.0'
name: release-payloads
displayName: 发布功能包

# 推 v 开头的标签时触发。Gitee Go 的 Tag 匹配支持 前缀/精确/正则/排除 四种，
# 这里用前缀 —— v1.3.3.20260916 这类都能命中。
triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - stage:
      name: release
      displayName: 构建 / 校验 / 发版
      strategy: naturally
      trigger: auto
      steps:
        # 有意只放一个 step：Gitee Go 里跨 step / 跨 stage 传构建产物要另外配
        # artifacts，行为不如「一个 step 里做完」确定。这三件事本来就很快。
        - step: build@python
          name: release_payloads
          displayName: 构建 payload、校验清单、发版
          pythonVersion: '3.9'
          commands:
            # Gitee Go 没有 GitHub 那种标签变量，得自己从 git 取
            - TAG=$(git describe --tags --exact-match 2>/dev/null || git tag --points-at HEAD | head -1)
            - echo "tag = $TAG"
            - pip install packaging
            # 校验：已提交的 manifest.json 是否与本次构建的 sha256 一致。
            # 忘了提交 manifest 就到这里直接失败，而不是发一堆 hash 对不上的包。
            - python tools/make_payloads.py --out-dir dist --tag "$TAG" --check
            # GITEE_TOKEN 需要在流水线设置里作为私密变量配置
            - python tools/gitee_release.py --owner kryonF --repo more_-settings-features --tag "$TAG" --dist dist
