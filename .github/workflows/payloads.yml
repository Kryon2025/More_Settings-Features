name: 发布功能包

# 功能包（payload）的发布出口。
#
# 为什么是"滚动发布"：manifest.json 里的下载地址指到
#   https://github.com/{repo}/releases/download/payloads/<文件名>
# 标签写死成 payloads，所以每次发布要把「历史全部版本」一起传上去 ——
# 否则新版本一覆盖，老版本的地址就 404 了。
# 仓库里的 payloads/ 目录就是这些历史版本的存放处，所以附件只从它取。
#
# 触发：推 payloads 标签，或在 Actions 页手动运行。
on:
  push:
    tags:
      - "payloads"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install packaging

      # 先确认已提交的 manifest.json 与源码一致。不一致就别往下走：
      # 用户下载到的包会和清单里的 sha256 对不上。
      - name: 校验清单与源码一致
        run: python tools/make_payloads.py --check

      # 再按源码重构一遍并回写 payloads/，作为本次要上传的产物。
      - name: 构建功能包
        run: python tools/make_payloads.py --out-dir dist

      - name: 列出待上传的产物
        run: ls -lh payloads

      - name: 发布到 Release（滚动更新）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: payloads
          name: 功能包（滚动发布）
          draft: false
          prerelease: false
          # 历史版本也一起传：老版本的下载地址才不会失效。
          files: payloads/*.cwpayload
          body: |
            本页是各个功能包（payload）的下载出口，由 `payloads` 标签滚动更新。

            版本号、大小与 sha256 都以仓库根目录的
            [manifest.json](https://github.com/Kryon2025/More_Settings-Features/blob/main/manifest.json) 为准
            —— 加载器（`com.kryon.more_settings`）读的就是它。

            功能包不进插件广场，只在这里与仓库 `payloads/` 目录提供。
