name: 发布功能包

# 每个功能包一个独立标签 + Release：标签形如 kryon.overlay-1.4.3。
# 清单 manifest.json 里每条版本记录的 asset 各自指向自己那个 Release 的文件。
#
# 触发：推 payloads-* 标记标签（一次把所有功能包都发出去），或手动运行。
# 每个功能包的历史版本各自独立，发布新版不会改动老包的 Release 与地址。
on:
  push:
    tags:
      - "payloads-*"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      payloads: ${{ steps.list.outputs.payloads }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 清单与源码不一致就别发：用户下载到的包会和清单里的 sha256 对不上。
      - name: 校验清单与源码一致
        run: python tools/make_payloads.py --check

      - name: 列出各功能包（标签 / 文件 / 标题）
        id: list
        run: python tools/list_payloads.py >> "$GITHUB_OUTPUT"

  release:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        payload: ${{ fromJSON(needs.list.outputs.payloads) }}
    steps:
      - uses: actions/checkout@v4

      - name: 发布 ${{ matrix.payload.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.payload.tag }}
          name: ${{ matrix.payload.title }}
          draft: false
          prerelease: false
          files: payloads/${{ matrix.payload.name }}
          body: ${{ matrix.payload.body }}
