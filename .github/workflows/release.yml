name: 校验功能包清单

# 功能包（payload）不再作为 Release 附件上传：
# 它们是仓库里的普通文件 (payloads/*.cwpayload)，由 manifest.json 里的直链分发。
# 所以这个工作流只做一件事：确认「源码改过之后，payloads/ 和 manifest.json 都重新生成并提交了」。
#
# 忘了重建的表现：用户下载到的包与清单里的 sha256 对不上，安装器会拒绝。
on:
  push:
    branches: ["main"]
    paths:
      - "features_src/**"
      - "payloads/**"
      - "manifest.json"
      - "tools/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: pip install packaging

      - name: 校验 manifest.json 与 payloads/ 里的文件一致
        run: python tools/make_payloads.py --check
